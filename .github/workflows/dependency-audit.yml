name: Locked dependency audit

on:
  schedule:
    - cron: "19 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install locked audit tool
        run: |
          python -m venv quality/.venv
          quality/.venv/bin/python -m pip install --require-hashes -r quality/requirements.txt
      - name: Audit npm locks and Python runtime and quality requirements
        run: quality/.venv/bin/python quality/audit_dependencies.py --output quality/reports/dependencies
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-audit
          path: quality/reports/dependencies/*.json
          if-no-files-found: error
