name: Polyglot quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            quality/package-lock.json
            graphspace/package-lock.json
            viewer/app/package-lock.json
      - name: Install locked quality tools
        run: |
          python -m venv quality/.venv
          quality/.venv/bin/python -m pip install --require-hashes -r quality/requirements.txt
          npm ci --prefix quality
          npm ci --prefix graphspace
          npm ci --prefix viewer/app
          quality/.venv/bin/python quality/install_binaries.py --destination quality/.bin
          {
            echo "$GITHUB_WORKSPACE/quality/.venv/bin"
            echo "$GITHUB_WORKSPACE/quality/.bin"
          } >> "$GITHUB_PATH"
      - name: Test quality failure boundaries
        run: quality/.venv/bin/python -m pytest -q tests/test_quality_ratchet.py tests/test_quality_badges.py
      - name: Generate revision-bound stack badges
        run: quality/.venv/bin/python quality/badges.py --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/stack-badges"
      - name: Check full source against reviewed debt
        run: quality/.venv/bin/python quality/run.py --output quality/reports/ci
      - name: Publish quality summary
        if: always()
        run: |
          if [ -f quality/reports/ci/summary.md ]; then
            cat quality/reports/ci/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: polyglot-quality
          path: |
            quality/reports/ci/report.json
            quality/reports/ci/summary.md
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stack-badges
          path: ${{ runner.temp }}/stack-badges
          if-no-files-found: error

  publish-badges:
    needs: static-quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Publish the complete badge set in one commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python quality/badges.py --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/published-stack-badges" --publish
